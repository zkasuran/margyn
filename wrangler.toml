# The hosted half of Margyn. The scanner is not here on purpose: see worker/index.mjs.
name = "margyn"
main = "worker/index.mjs"
compatibility_date = "2026-08-05"

# The worker answers on the apex and on www. Cloudflare issues the certificate
# and manages the DNS record, so there is nothing to renew by hand.
routes = [
  { pattern = "margyn.xyz", custom_domain = true },
  { pattern = "www.margyn.xyz", custom_domain = true },
]

# Keep the workers.dev URL alive as a fallback. If DNS or the certificate is
# mid-change, a submission link that resolves is worth more than a tidy config.
workers_dev = true

# No [assets] block. The frontend is bundled into the script by
# bin/bundle-static.mjs, because Cloudflare's assets API answered every upload
# with a 500 on 2026-08-05 and two files with no build step fit the script
# limit comfortably. One upload also means the page and the API can never be
# deployed at different versions. Run `npm run worker:bundle` after editing
# anything in web/public.

# Sandbox by default. Getting this wrong towards live charges real money, so the
# safe value is the one you get by forgetting to set it.
[vars]
TIUN_ENV = "sandbox"

# Secrets are never in this file. Set them once per environment:
#   npx wrangler secret put TIUN_SANDBOX_API_KEY
#   npx wrangler secret put MARGYN_LICENCE_KEY
# and the public ones too, since a var here would be committed:
#   npx wrangler secret put TIUN_SANDBOX_SNIPPET_ID
#   npx wrangler secret put TIUN_SANDBOX_PRODUCT_WATCH
#   npx wrangler secret put TIUN_SANDBOX_PRODUCT_FIXPACK
