# The hosted half of Margyn. The scanner is not here on purpose: see worker/index.mjs.
name = "margyn"
main = "worker/index.mjs"
compatibility_date = "2026-08-05"

# The worker answers on the apex and on www. Cloudflare issues the certificate
# and manages the DNS record, so there is nothing to renew by hand.
routes = [
  { pattern = "margyn.xyz", custom_domain = true },
  { pattern = "www.margyn.xyz", custom_domain = true },
]

# Keep the workers.dev URL alive as a fallback. If DNS or the certificate is
# mid-change, a submission link that resolves is worth more than a tidy config.
workers_dev = true

# No [assets] block. The frontend is bundled into the script by
# bin/bundle-static.mjs, because Cloudflare's assets API answered every upload
# with a 500 on 2026-08-05, and the whole frontend fits the script limit
# comfortably (the bundler fails the build if that stops being true). One upload
# also means the page and the API can never be deployed at different versions.
# `npm run build` rebuilds the pages and the bundle together.

# The deployed worker charges real cards. The code treats any value other than
# "live" as Tiun's sandbox, so a missing or misspelt TIUN_ENV fails towards the
# environment that cannot take money. .dev.vars.example sets sandbox for local dev.
[vars]
TIUN_ENV = "live"

# Secrets are never in this file. Set them once per environment, live names shown;
# the sandbox uses the same names with a TIUN_SANDBOX_ prefix:
#   npx wrangler secret put TIUN_API_KEY
#   npx wrangler secret put MARGYN_LICENCE_KEY
# and the public ones too, since a var here would be committed:
#   npx wrangler secret put TIUN_SNIPPET_ID
#   npx wrangler secret put TIUN_PRODUCT_WATCH
#   npx wrangler secret put TIUN_PRODUCT_TEAM
#   npx wrangler secret put TIUN_PRODUCT_FIXFLOW
#   npx wrangler secret put TIUN_PRODUCT_SOLOFIX
