name: Margyn
description: >-
  Audit the verification layer of a repository. Finds tests that assert nothing,
  files git never committed and gates nothing invokes, then fails the job with a
  reproduction for each finding. Can post the findings on the pull request and
  upload them to the Security tab.
author: Asura Coding Works
branding:
  icon: alert-circle
  color: green

inputs:
  path:
    description: Repository path to scan. Defaults to the checkout root.
    required: false
    default: "."
  version:
    description: Which margyn-scan release to run. Pin it so a job cannot change under you.
    required: false
    default: "0.3.1"
  mutate:
    description: >-
      Run the mutation proof too. Part of Watch, so it needs a licence in the
      MARGYN_LICENCE environment variable. A missing licence prints the reason and
      never fails the job.
    required: false
    default: "false"
  max:
    description: How many mutations to try when mutate is true.
    required: false
    default: "4"
  json:
    description: Also write the findings to margyn.json in the workspace.
    required: false
    default: "false"
  comment:
    description: >-
      Post the findings as a single pull-request comment, updated in place on
      each push. Needs `permissions: pull-requests: write` on the job and only
      runs on pull_request events.
    required: false
    default: "false"
  sarif:
    description: >-
      Upload the findings to GitHub code scanning so they show in the Security
      tab. Needs `permissions: security-events: write` on the job.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Audit the verification layer
      shell: bash
      # Inputs and context are passed through the environment rather than
      # interpolated into the script, so a value containing shell syntax can never
      # become shell. The token is the caller's own GITHUB_TOKEN.
      env:
        MARGYN_PATH: ${{ inputs.path }}
        MARGYN_VERSION: ${{ inputs.version }}
        MARGYN_MUTATE: ${{ inputs.mutate }}
        MARGYN_MAX: ${{ inputs.max }}
        MARGYN_JSON: ${{ inputs.json }}
        MARGYN_COMMENT: ${{ inputs.comment }}
        MARGYN_SARIF: ${{ inputs.sarif }}
        GH_TOKEN: ${{ github.token }}
        API_URL: ${{ github.api_url }}
        REPO: ${{ github.repository }}
        EVENT: ${{ github.event_name }}
        PR: ${{ github.event.pull_request.number }}
        SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        REF: ${{ github.ref }}
      run: |
        set -uo pipefail
        # Installed into a directory of its own rather than run through npx.
        # `npx margyn-scan` resolves a local package of the same name first, which
        # breaks the moment the repository being scanned is this one.
        dir="${RUNNER_TEMP:-/tmp}/margyn-$MARGYN_VERSION"
        mkdir -p "$dir"
        npm install --no-save --no-audit --no-fund --prefix "$dir" "margyn-scan@$MARGYN_VERSION" > /dev/null
        bin="$dir/node_modules/.bin/margyn-scan"
        if [ ! -x "$bin" ]; then
          echo "margyn-scan@$MARGYN_VERSION did not install, so nothing was audited" >&2
          exit 90
        fi

        args=("$MARGYN_PATH" --comment-out=margyn-comment.md)
        [ "$MARGYN_MUTATE" = "true" ] && args+=(--mutate "--max=$MARGYN_MAX")
        [ "$MARGYN_SARIF" = "true" ] && args+=(--sarif-out=margyn.sarif)

        status=0
        if [ "$MARGYN_JSON" = "true" ]; then
          "$bin" "${args[@]}" --json > margyn.json || status=$?
          cat margyn.json
        else
          "$bin" "${args[@]}" || status=$?
        fi

        # The Markdown report is the CI job summary either way. Free, and it cannot
        # fail the run, so it is unconditional.
        if [ -f margyn-comment.md ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          cat margyn-comment.md >> "$GITHUB_STEP_SUMMARY"
        fi

        # A pull-request comment, updated in place. Posting is auxiliary: a failure
        # here warns but never masks the audit result, which is the exit code.
        if [ "$MARGYN_COMMENT" = "true" ] && [ "$EVENT" = "pull_request" ] && [ -n "$PR" ]; then
          body=$(jq -Rs . < margyn-comment.md)
          existing=$(curl -sS -H "authorization: Bearer $GH_TOKEN" -H "accept: application/vnd.github+json" \
            "$API_URL/repos/$REPO/issues/$PR/comments?per_page=100" \
            | jq -r '[.[] | select(.body | startswith("<!-- margyn-report -->")) | .id][0] // empty')
          if [ -n "$existing" ]; then
            curl -sS -X PATCH -H "authorization: Bearer $GH_TOKEN" -H "accept: application/vnd.github+json" \
              "$API_URL/repos/$REPO/issues/comments/$existing" -d "{\"body\":$body}" > /dev/null \
              || echo "::warning::margyn could not update its PR comment"
          else
            curl -sS -X POST -H "authorization: Bearer $GH_TOKEN" -H "accept: application/vnd.github+json" \
              "$API_URL/repos/$REPO/issues/$PR/comments" -d "{\"body\":$body}" > /dev/null \
              || echo "::warning::margyn could not post its PR comment"
          fi
        fi

        # Upload to code scanning. gzip then base64, which is what the SARIF
        # endpoint wants. Also auxiliary, so a failure warns rather than fails.
        if [ "$MARGYN_SARIF" = "true" ] && [ -f margyn.sarif ]; then
          payload=$(jq -n --arg c "$SHA" --arg r "$REF" \
            --arg s "$(gzip -c margyn.sarif | base64 -w0)" \
            '{commit_sha:$c, ref:$r, sarif:$s}')
          curl -sS -X POST -H "authorization: Bearer $GH_TOKEN" -H "accept: application/vnd.github+json" \
            "$API_URL/repos/$REPO/code-scanning/sarifs" -d "$payload" > /dev/null \
            || echo "::warning::margyn could not upload SARIF (does the job have security-events: write?)"
        fi

        # Exit code 1 means findings, which should fail the job. Anything else is
        # the tool itself going wrong, which should fail louder, so it is passed
        # straight through.
        exit "$status"
