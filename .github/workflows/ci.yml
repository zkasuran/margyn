name: ci

# The gates that decide whether this ships, run on every push. The last step runs
# our own action over our own repository, so the thing we sell is exercised by the
# pipeline that publishes it rather than only in a demo.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    # The audit step below posts its report on the pull request and sends the same
    # findings to code scanning, so the job needs those two write scopes. Read is
    # spelled out because naming any permission drops the rest.
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No install step: the scanner has no runtime dependencies and the suite
      # runs on node:test, so there is nothing to fetch before testing.
      - name: Tests
        run: npm test

      - name: Palette contrast gate
        run: node bin/contrast.mjs

      - name: The built pages match their modules
        run: |
          npm run build
          git diff --exit-code -- web/public worker/static.generated.mjs

      - name: Audit our own verification layer
        uses: ./
        with:
          path: .
          # On a pull request the report lands as a comment on the request itself
          # and in the Security tab. Both are the action's own code paths, so this
          # repository is the first user of them rather than the demo of them.
          comment: true
          sarif: true
